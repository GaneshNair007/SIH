{% extends "base.html" %}

{% block title %}Rakshak (रक्षक) — H2S Safety Chatbot{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto flex flex-col h-[calc(100vh-11rem)] bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
    <!-- Chat Header -->
    <div class="bg-slate-800/90 px-5 py-3.5 border-b border-slate-700/80 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-md shadow-cyan-500/20">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-white text-base">Rakshak AI (रक्षक)</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 font-semibold">H₂S Safety Advisor</span>
                </div>
                <div class="text-[11px] text-emerald-400 flex items-center gap-1.5 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="chatStatusText">Active • Worker EMP-1042</span>
                </div>
            </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-2">
            <button onclick="resetChat()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs transition" title="New Conversation">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <a href="/manager" class="px-3 py-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-user-tie text-amber-400"></i>
                <span class="hidden sm:inline">Manager Portal</span>
            </a>
        </div>
    </div>

    <!-- Chat Messages Stream -->
    <div id="chatStream" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 text-sm">
        <!-- Messages & rich cards injected here -->
    </div>

    <!-- Quick Action Suggestions Chips -->
    <div class="px-4 py-2.5 bg-slate-950/80 border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto text-xs no-scrollbar">
        <span class="text-slate-500 font-semibold text-[11px] whitespace-nowrap"><i class="fa-solid fa-bolt text-cyan-400 mr-1"></i>Quick:</span>
        <div id="quickChipsContainer" class="flex items-center gap-2">
            <!-- Dynamic action chips -->
        </div>
    </div>

    <!-- Input Bar with Camera / Photo Scanner -->
    <form id="unifiedChatForm" onsubmit="handleUnifiedChatSubmit(event)" class="p-3.5 bg-slate-800/90 border-t border-slate-700 flex items-center gap-2">
        <input type="file" id="chatPhotoInput" accept="image/*" class="hidden" onchange="handleChatPhotoUpload(event)">
        <button type="button" onclick="document.getElementById('chatPhotoInput').click()" class="p-3 bg-slate-900 hover:bg-slate-700 text-cyan-400 hover:text-cyan-300 border border-slate-700 rounded-xl transition text-sm flex items-center justify-center" title="Snap / Upload Badge Photo">
            <i class="fa-solid fa-camera"></i>
        </button>
        <input 
            type="text" 
            id="chatInputBox" 
            placeholder="Type a message or tap 📷 to scan your wristband..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
            autocomplete="off"
        >
        <button type="submit" id="chatSendBtn" class="px-5 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl text-sm font-semibold flex items-center gap-2 shadow-lg shadow-cyan-900/30 transition">
            <span>Send</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentSession = 'worker_sess_' + Math.random().toString(36).substr(2, 9);

function addBotMessage(text, scanResult = null) {
    const stream = document.getElementById('chatStream');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'flex items-start gap-3';

    let cardHtml = '';
    if (scanResult) {
        const tier = scanResult.tier;
        let tierColor = 'bg-emerald-950 text-emerald-400 border-emerald-800';
        if (tier.includes('TIER 3')) tierColor = 'bg-rose-950 text-rose-400 border-rose-800';
        else if (tier.includes('TIER 2')) tierColor = 'bg-amber-950 text-amber-400 border-amber-800';

        let recsHtml = '';
        if (scanResult.recommendations) {
            scanResult.recommendations.forEach(r => {
                let rTag = 'text-cyan-400 bg-cyan-950 border-cyan-800';
                if (r.priority_level.includes('MANDATORY')) rTag = 'text-rose-400 bg-rose-950 border-rose-800';
                else if (r.priority_level.includes('RECOMMENDED')) rTag = 'text-amber-400 bg-amber-950 border-amber-800';

                recsHtml += `
                    <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded border ${rTag}">${r.priority_level}</span>
                            <span class="text-[10px] text-slate-400">${r.category}</span>
                        </div>
                        <div class="text-xs text-white">${r.action_item}</div>
                        ${r.action_item_hi ? `<div class="text-[11px] text-slate-400">${r.action_item_hi}</div>` : ''}
                    </div>
                `;
            });
        }

        cardHtml = `
            <div class="mt-3 p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-mono text-slate-400">${scanResult.scan_id}</span>
                    <span class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full border ${tierColor}">${tier}</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                        <div class="text-[10px] text-slate-400">Shift TWA</div>
                        <div class="font-bold text-cyan-400 font-mono">${scanResult.twa} ppm</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                        <div class="text-[10px] text-slate-400">Comp. Dose</div>
                        <div class="font-bold text-white font-mono">${scanResult.compensated_dose} ppm·hr</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                        <div class="text-[10px] text-slate-400">7-Day Load</div>
                        <div class="font-bold text-amber-400 font-mono">${scanResult.updated_7day_load} ppm·hr</div>
                    </div>
                </div>
                ${recsHtml ? `<div class="space-y-2 pt-1"><div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Prioritized Action Items:</div>${recsHtml}</div>` : ''}
            </div>
        `;
    }

    msgDiv.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-cyan-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="bg-slate-800/90 border border-slate-700/80 text-slate-100 rounded-2xl rounded-tl-none p-4 max-w-[85%] leading-relaxed whitespace-pre-line shadow-md">
            ${text}
            ${cardHtml}
        </div>
    `;
    stream.appendChild(msgDiv);
    stream.scrollTop = stream.scrollHeight;
}

function addUserMessage(text) {
    const stream = document.getElementById('chatStream');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'flex items-start justify-end gap-3';
    msgDiv.innerHTML = `
        <div class="bg-cyan-600 text-white rounded-2xl rounded-tr-none p-3.5 max-w-[85%] leading-relaxed shadow">
            ${text}
        </div>
        <div class="w-8 h-8 rounded-xl bg-slate-700 flex-shrink-0 flex items-center justify-center text-slate-200 text-xs font-bold">
            <i class="fa-solid fa-user"></i>
        </div>
    `;
    stream.appendChild(msgDiv);
    stream.scrollTop = stream.scrollHeight;
}

function setQuickChips(chips) {
    const container = document.getElementById('quickChipsContainer');
    container.innerHTML = '';
    chips.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap transition text-xs flex items-center gap-1.5';
        btn.textContent = c;
        btn.onclick = () => {
            document.getElementById('chatInputBox').value = c;
            document.getElementById('unifiedChatForm').dispatchEvent(new Event('submit'));
        };
        container.appendChild(btn);
    });
}

async function sendUnifiedMessage(text) {
    addUserMessage(text);
    document.getElementById('chatInputBox').value = '';

    const btn = document.getElementById('chatSendBtn');
    btn.disabled = true;

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: currentSession,
                message: text
            })
        });
        const data = await res.json();
        addBotMessage(data.reply, data.scan_result);
        if (data.quick_actions) {
            setQuickChips(data.quick_actions);
        }
    } catch (e) {
        addBotMessage("Sorry, I could not process your request right now. Please check the network.");
    } finally {
        btn.disabled = false;
    }
}

async function handleChatPhotoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    addUserMessage("📷 *Uploaded wristband photo for optical analysis...*");
    const sendBtn = document.getElementById('chatSendBtn');
    sendBtn.disabled = true;

    try {
        const formData = new FormData();
        formData.append('file', file, 'wristband.jpg');

        const res = await fetch('/api/scan/analyze-image', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        if (data.success) {
            // Forward the extracted delta_e and patch data into the unified chat flow
            const chatMsg = `Shift ended in CDU-1. Analyzed badge photo: ΔE reading is ${data.delta_e} (Patch B drift: ${data.patch_b_drift}, Patch C: ${data.patch_c_condition}).`;
            const chatRes = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSession,
                    message: chatMsg
                })
            });
            const chatData = await chatRes.json();
            addBotMessage(chatData.reply, chatData.scan_result);
            if (chatData.quick_actions) setQuickChips(chatData.quick_actions);
        } else {
            addBotMessage("⚠️ Could not clearly read the wristband spot from that photo. Please ensure good lighting and try again, or type your reading manually.");
        }
    } catch (err) {
        addBotMessage("Error processing badge image: " + err.message);
    } finally {
        sendBtn.disabled = false;
        e.target.value = '';
    }
}

function handleUnifiedChatSubmit(e) {
    e.preventDefault();
    const text = document.getElementById('chatInputBox').value.trim();
    if (text) {
        sendUnifiedMessage(text);
    }
}

function resetChat() {
    currentSession = 'worker_sess_' + Math.random().toString(36).substr(2, 9);
    document.getElementById('chatStream').innerHTML = '';
    addBotMessage("Namaste Rajesh! I am **Rakshak (रक्षक)**, your plant safety companion.\n\nHow was your shift today? You can share your badge reading, check your exposure status, or let me know if you are feeling any symptoms.\n\n*Type your message or select an option below:*");
    setQuickChips([
        "Log Badge Reading (4.2)",
        "My Exposure Status",
        "Olfactory Smell Test",
        "Switch to हिन्दी",
        "Safety Guidelines (PPE)"
    ]);
}

window.onload = () => {
    resetChat();
};
</script>
{% endblock %}
