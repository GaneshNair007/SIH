{% extends "base.html" %}

{% block title %}Login & Demo Mode — Rakshak (रक्षक){% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 space-y-6 animate-fadeIn">
    <!-- Header Card -->
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 text-white text-2xl shadow-xl shadow-cyan-900/30">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-black text-white tracking-wide">RAKSHAK <span class="text-cyan-400 font-normal text-lg">(रक्षक)</span></h1>
        <p class="text-xs text-slate-400">Occupational Safety & Dosimetry Intelligence Platform</p>
    </div>

    <!-- Login & 1-Click Demo Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
        <!-- Standard Login Form -->
        <form onsubmit="handleStandardLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 font-semibold mb-1.5">Username / Employee ID</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500"></i>
                    <input type="text" id="loginUsername" placeholder="e.g. EMP-1042 or manager01" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-white font-mono focus:outline-none focus:border-cyan-500 transition" required>
                </div>
            </div>

            <div>
                <label class="block text-slate-300 font-semibold mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-white font-mono focus:outline-none focus:border-cyan-500 transition" required>
                </div>
            </div>

            <button type="submit" id="standardLoginBtn" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl font-bold shadow-lg shadow-cyan-900/30 transition flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex items-center justify-center">
            <div class="border-t border-slate-800 w-full"></div>
            <span class="bg-slate-900 px-3 text-[10px] uppercase tracking-wider font-bold text-slate-500 font-mono">1-Click Instant Demo Mode</span>
        </div>

        <!-- 1-Click Demo Role Selectors (Beneath login as requested) -->
        <div class="space-y-2.5">
            <button type="button" onclick="triggerDemoLogin('employee', 'EMP-1042')" class="w-full p-3 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 transition flex items-center justify-between text-left group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-cyan-950/80 border border-cyan-800 text-cyan-400 flex items-center justify-center text-base">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    <div>
                        <div class="text-xs font-bold text-white group-hover:text-cyan-300 transition">Enter as Employee (Rajesh Kumar)</div>
                        <div class="text-[10px] text-slate-400">CDU-1 Unit • Rakshak AI Chatbot & Badge Scanner</div>
                    </div>
                </div>
                <span class="text-xs text-cyan-400 group-hover:translate-x-1 transition"><i class="fa-solid fa-chevron-right"></i></span>
            </button>

            <button type="button" onclick="triggerDemoLogin('manager')" class="w-full p-3 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500 transition flex items-center justify-between text-left group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-950/80 border border-amber-800 text-amber-400 flex items-center justify-center text-base">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div>
                        <div class="text-xs font-bold text-white group-hover:text-amber-300 transition">Enter as Shift Manager (Vikram Singh)</div>
                        <div class="text-[10px] text-slate-400">2D Leak Heatmap • Live Workforce Roster • OISD Reports</div>
                    </div>
                </div>
                <span class="text-xs text-amber-400 group-hover:translate-x-1 transition"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function triggerDemoLogin(role, empId = 'EMP-1042') {
    try {
        const res = await fetch('/api/auth/demo-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: role, employee_id: empId })
        });
        const data = await res.json();
        
        if (role === 'manager') {
            window.location.href = '/manager';
        } else {
            window.location.href = '/';
        }
    } catch (err) {
        alert('Demo Login Error: ' + err.message);
    }
}

async function handleStandardLogin(e) {
    e.preventDefault();
    const u = document.getElementById('loginUsername').value;
    const p = document.getElementById('loginPassword').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (data.role === 'MANAGER' || data.role === 'HSE_OFFICER') {
            window.location.href = '/manager';
        } else {
            window.location.href = '/';
        }
    } catch (err) {
        alert('Login Error: ' + err.message);
    }
}
</script>
{% endblock %}
